# web-server configuration (demo)

[server]
host = "127.0.0.1"
port = 6868
threads = 4
keep_alive_timeout = 5
read_timeout = 15
max_header_bytes = 16384
max_body_bytes = 1048576

[routes]
# Serve the demo site from the ./demo directory.
"/" = "./demo"
# A single-file route example.
"/merhaba" = "./demo/about.html"

[cache]
ttl = 60
max_size = "64M"
max_file_size = "8M"

[stats]
# Built-in dashboard: http://127.0.0.1:6868/statistics.html
enabled = true
path = "/statistics"
page = "/statistics.html"
page_file = "static/statistics.html"
file = "stats.jsonl"
interval = 2

[logging]
# Use "-" to log to the console.
path = "-"
